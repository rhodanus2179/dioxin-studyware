name: Validate studyware
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/app.js && node --check js/storage.js
      - run: node tests/validate.mjs
      - run: node tests/validate-outline.mjs
      - run: node tests/validate-knowledge-linkage.mjs
      - run: node tests/validate-semantic-adjudication.mjs
      - run: node tests/validate-precision-source-audit.mjs
      - run: node tests/validate-figure-policy.mjs
      - run: node tests/validate-research.mjs
      - run: node tests/validate-facilities.mjs
      - run: node tests/validate-past-exams.mjs
      - run: node tests/validate-answer-keys.mjs
      - run: node tests/validate-cross-year.mjs
      - run: node tests/validate-three-years.mjs
      - run: node tests/validate-four-years.mjs
      - run: node tests/validate-five-years.mjs
      - run: node tests/validate-claim-evidence.mjs
