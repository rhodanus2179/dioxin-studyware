<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1480 830" width="1480" height="830" role="img" aria-label="測定の全体フロー">
<title>測定の全体フロー</title><desc>採取から異性体別濃度・毒性等量（TEQ）までを二段階で追う</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#202632"/></marker></defs>
<style>
text{font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#1d2630}
.bold{font-weight:700}.center{text-anchor:middle}.small{font-size:16px}.minor{fill:#495461}
.panel{fill:#fff;stroke:#202632;stroke-width:2.3}.gray{fill:#f0f2f4;stroke:#202632;stroke-width:2.3}
.tint{fill:#dfe3e8;stroke:#202632;stroke-width:2.3}
.dashbox{fill:#fff;stroke:#47515c;stroke-width:2.4;stroke-dasharray:9 6}
.arr{stroke:#202632;stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#66707a;stroke-width:2;fill:none}.dashed{stroke:#65707a;stroke-width:2.5;stroke-dasharray:8 6;fill:none}
.particle{fill:#1d2630;stroke:#1d2630}.border{stroke:#9aa2ab;stroke-width:1}
</style>
<rect width="1480" height="830" fill="white"/>
<text x="45" y="54" font-size="31" class="bold">図12-2　測定の全体フロー</text>
<text x="45" y="89" font-size="18" class="minor">採取から異性体別濃度・毒性等量（TEQ）までを二段階で追う</text>
<line x1="45" y1="109" x2="1435" y2="109" class="border"/>
<text x="80" y="143" font-size="20" class="bold">工程1：試料から装置測定まで（→）</text><text x="1180" y="438" font-size="20" class="bold">工程2：結果の評価（←）</text><rect class="panel" x="80" y="185" width="215" height="132" rx="12"/><text x="187.5" y="227" font-size="25" class="center bold">① 計画</text><text x="187.5" y="264" font-size="19" class="center">媒体・目的</text><text x="187.5" y="291" font-size="19" class="center">採取量・下限</text><path class="arr" d="M299 250 L326 250" marker-end="url(#arrow)"/><rect class="gray" x="335" y="185" width="215" height="132" rx="12"/><text x="442.5" y="227" font-size="25" class="center bold">② 採取</text><text x="442.5" y="264" font-size="19" class="center">代表性・保存</text><text x="442.5" y="291" font-size="19" class="center">内標準は媒体別</text><path class="arr" d="M554 250 L581 250" marker-end="url(#arrow)"/><rect class="panel" x="590" y="185" width="215" height="132" rx="12"/><text x="697.5" y="227" font-size="25" class="center bold">③ 抽出・精製</text><text x="697.5" y="264" font-size="19" class="center">抽出して妨害除去</text><text x="697.5" y="291" font-size="19" class="center">回収率を確認</text><path class="arr" d="M809 250 L836 250" marker-end="url(#arrow)"/><rect class="gray" x="845" y="185" width="215" height="132" rx="12"/><text x="952.5" y="227" font-size="25" class="center bold">④ 最終液</text><text x="952.5" y="264" font-size="19" class="center">分取・濃縮</text><text x="952.5" y="291" font-size="19" class="center">必要な標準を添加</text><path class="arr" d="M1064 250 L1091 250" marker-end="url(#arrow)"/><rect class="panel" x="1100" y="185" width="215" height="132" rx="12"/><text x="1207.5" y="227" font-size="25" class="center bold">⑤ GC/MS</text><text x="1207.5" y="264" font-size="19" class="center">分離・同定</text><text x="1207.5" y="291" font-size="19" class="center">ピーク面積を測る</text><path class="arr" d="M1287 319 L1287 474" marker-end="url(#arrow)"/><rect class="panel" x="80" y="476" width="215" height="130" rx="12"/><text x="187.5" y="518" font-size="25" class="center bold">⑩ 報告</text><text x="187.5" y="555" font-size="19" class="center">QA/QCと測定目的</text><text x="187.5" y="582" font-size="19" class="center">下限・単位を併記</text><path class="arr" d="M327 541 L302 541" marker-end="url(#arrow)"/><rect class="gray" x="335" y="476" width="215" height="130" rx="12"/><text x="442.5" y="518" font-size="25" class="center bold">⑨ 評価</text><text x="442.5" y="555" font-size="19" class="center">法定計算法・補正</text><text x="442.5" y="582" font-size="19" class="center">媒体ごとの条件</text><path class="arr" d="M582 541 L557 541" marker-end="url(#arrow)"/><rect class="panel" x="590" y="476" width="215" height="130" rx="12"/><text x="697.5" y="518" font-size="25" class="center bold">⑧ 総TEQ</text><text x="697.5" y="555" font-size="19" class="center">異性体別TEQ</text><text x="697.5" y="582" font-size="19" class="center">を合計</text><path class="arr" d="M837 541 L812 541" marker-end="url(#arrow)"/><rect class="gray" x="845" y="476" width="215" height="130" rx="12"/><text x="952.5" y="518" font-size="25" class="center bold">⑦ TEF</text><text x="952.5" y="555" font-size="19" class="center">適用する版の</text><text x="952.5" y="582" font-size="19" class="center">係数を掛ける</text><path class="arr" d="M1092 541 L1067 541" marker-end="url(#arrow)"/><rect class="panel" x="1100" y="476" width="215" height="130" rx="12"/><text x="1207.5" y="518" font-size="25" class="center bold">⑥ 異性体別濃度</text><text x="1207.5" y="555" font-size="19" class="center">試料量と分取率</text><text x="1207.5" y="582" font-size="19" class="center">元の媒体単位へ</text><rect class="dashbox" x="80" y="641" width="1235" height="80" rx="12"/><text x="100" y="669" font-size="20" >内標準の添加位置は媒体・採用方式に依存する。図12-10に排ガスK 0311の具体例を示す。</text><text x="100" y="702" font-size="19" >GC/MSで測る量と法令で判定するTEQは、試料量換算・TEF・ND処理を経て結び付く。</text>
<line x1="45" y1="763" x2="1435" y2="763" class="border"/>
<text x="45" y="788" font-size="16" class="minor">根拠：第12章12.1・表12-1、図12-2指示｜工程は教育用に概念化、規格の操作図を転写していない。</text>
</svg>