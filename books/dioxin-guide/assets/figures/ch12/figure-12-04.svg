<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1495 820" width="1495" height="820" role="img" aria-label="等速吸引と粒子の採取偏り">
<title>等速吸引と粒子の採取偏り</title><desc>排ガス採取におけるノズル入口の速度と慣性粒子の関係（模式図）</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#202632"/></marker></defs>
<style>
text{font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#1d2630}
.bold{font-weight:700}.center{text-anchor:middle}.small{font-size:16px}.minor{fill:#495461}
.panel{fill:#fff;stroke:#202632;stroke-width:2.3}.gray{fill:#f0f2f4;stroke:#202632;stroke-width:2.3}
.tint{fill:#dfe3e8;stroke:#202632;stroke-width:2.3}
.dashbox{fill:#fff;stroke:#47515c;stroke-width:2.4;stroke-dasharray:9 6}
.arr{stroke:#202632;stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#66707a;stroke-width:2;fill:none}.dashed{stroke:#65707a;stroke-width:2.5;stroke-dasharray:8 6;fill:none}
.particle{fill:#1d2630;stroke:#1d2630}.border{stroke:#9aa2ab;stroke-width:1}
</style>
<rect width="1495" height="820" fill="white"/>
<text x="45" y="54" font-size="31" class="bold">図12-4　等速吸引と粒子の採取偏り</text>
<text x="45" y="89" font-size="18" class="minor">排ガス採取におけるノズル入口の速度と慣性粒子の関係（模式図）</text>
<line x1="45" y1="109" x2="1450" y2="109" class="border"/>
<text x="40" y="144" font-size="20" >気体の流線＝破線　／　比較的大きい慣性粒子＝●　／　入口平均速度 vₙ、局所ガス速度 vₛ</text><rect class="panel" x="35" y="180" width="455" height="426" rx="12"/><text x="263" y="220" font-size="26" class="bold center">等速吸引</text><text x="263" y="253" font-size="19" class="center">vₙ = vₛ　／　I = 100%</text><path class="arr" d="M318 310 H455 V400 H318" /><text x="380" y="429" font-size="17" class="center minor">採取管</text><path class="arr" d="M341 355 L429 355" marker-end="url(#arrow)"/><path class="dashed" d="M75 290 H453" marker-end="url(#arrow)"/><path class="dashed" d="M75 420 H453" marker-end="url(#arrow)"/><path class="dashed" d="M75 329 H442" marker-end="url(#arrow)"/><path class="dashed" d="M75 376 H442" marker-end="url(#arrow)"/><circle class="particle" cx="117" cy="332" r="7"/><path class="arr" d="M128 332 L293 332" marker-end="url(#arrow)"/><circle class="particle" cx="117" cy="369" r="7"/><path class="arr" d="M128 369 L293 369" marker-end="url(#arrow)"/><text x="263" y="493" font-size="20" class="center bold">偏りを抑える（理想）</text><text x="263" y="541" font-size="17" class="center minor">粒径・密度・流動条件で程度は変化</text><rect class="panel" x="520" y="180" width="455" height="426" rx="12"/><text x="748" y="220" font-size="26" class="bold center">吸引が遅い</text><text x="748" y="253" font-size="19" class="center">vₙ ＜ vₛ　／　I ＜ 100%</text><path class="arr" d="M803 310 H940 V400 H803" /><text x="865" y="429" font-size="17" class="center minor">採取管</text><path class="arr" d="M826 355 L914 355" marker-end="url(#arrow)"/><path class="dashed" d="M560 290 H938" marker-end="url(#arrow)"/><path class="dashed" d="M560 420 H938" marker-end="url(#arrow)"/><path class="dashed" d="M560 330 C685 330 732 305 772 289" marker-end="url(#arrow)"/><path class="dashed" d="M560 376 C685 376 732 398 772 421" marker-end="url(#arrow)"/><circle class="particle" cx="611" cy="332" r="7"/><path class="arr" d="M623 332 L842 332" marker-end="url(#arrow)"/><circle class="particle" cx="611" cy="373" r="7"/><path class="arr" d="M623 373 L842 373" marker-end="url(#arrow)"/><text x="748" y="493" font-size="20" class="center bold">粗粒子が過大捕集される傾向</text><text x="748" y="541" font-size="17" class="center minor">粒径・密度・流動条件で程度は変化</text><rect class="panel" x="1005" y="180" width="455" height="426" rx="12"/><text x="1233" y="220" font-size="26" class="bold center">吸引が速い</text><text x="1233" y="253" font-size="19" class="center">vₙ ＞ vₛ　／　I ＞ 100%</text><path class="arr" d="M1288 310 H1425 V400 H1288" /><text x="1350" y="429" font-size="17" class="center minor">採取管</text><path class="arr" d="M1311 355 L1399 355" marker-end="url(#arrow)"/><path class="dashed" d="M1045 290 H1423" marker-end="url(#arrow)"/><path class="dashed" d="M1045 420 H1423" marker-end="url(#arrow)"/><path class="dashed" d="M1045 291 C1181 291 1210 341 1320 343" marker-end="url(#arrow)"/><path class="dashed" d="M1045 417 C1181 417 1210 365 1320 365" marker-end="url(#arrow)"/><circle class="particle" cx="1085" cy="289" r="7"/><path class="arr" d="M1101 289 L1264 289" marker-end="url(#arrow)"/><circle class="particle" cx="1085" cy="418" r="7"/><path class="arr" d="M1101 418 L1264 418" marker-end="url(#arrow)"/><circle class="particle" cx="1095" cy="355" r="7"/><path class="arr" d="M1109 355 L1294 355" marker-end="url(#arrow)"/><text x="1233" y="493" font-size="20" class="center bold">粗粒子が過少捕集される傾向</text><text x="1233" y="541" font-size="17" class="center minor">粒径・密度・流動条件で程度は変化</text><rect class="gray" x="72" y="632" width="1330" height="88" rx="12"/><text x="95" y="661" font-size="20" >等速率 I = 100 × vₙ / vₛ（%）。両流速はノズル入口と同じ煙道条件で比較する。</text><text x="95" y="695" font-size="18" >K 0311公開掲載本文5.6：原則 −5～＋10%の流速相対誤差を管理（低ダスト等の規定例外あり、公式全文HOLD）。</text>
<line x1="45" y1="753" x2="1450" y2="753" class="border"/>
<text x="45" y="778" font-size="16" class="minor">原理図は本書独自制作。流線の形・粒子配置は実測・CFD結果でなく定性的模式表現。</text>
</svg>