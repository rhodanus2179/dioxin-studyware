<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1510 835" width="1510" height="835" role="img" aria-label="三種類の内標準スパイクの添加位置">
<title>三種類の内標準スパイクの添加位置</title><desc>試料調製の時間軸に沿って「いつ加え、どの工程を評価するか」を区別する</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#202632"/></marker></defs>
<style>
text{font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#1d2630}
.bold{font-weight:700}.center{text-anchor:middle}.small{font-size:16px}.minor{fill:#495461}
.panel{fill:#fff;stroke:#202632;stroke-width:2.3}.gray{fill:#f0f2f4;stroke:#202632;stroke-width:2.3}
.tint{fill:#dfe3e8;stroke:#202632;stroke-width:2.3}
.dashbox{fill:#fff;stroke:#47515c;stroke-width:2.4;stroke-dasharray:9 6}
.arr{stroke:#202632;stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#66707a;stroke-width:2;fill:none}.dashed{stroke:#65707a;stroke-width:2.5;stroke-dasharray:8 6;fill:none}
.particle{fill:#1d2630;stroke:#1d2630}.border{stroke:#9aa2ab;stroke-width:1}
</style>
<rect width="1510" height="835" fill="white"/>
<text x="45" y="54" font-size="31" class="bold">図12-10　三種類の内標準スパイクの添加位置</text>
<text x="45" y="89" font-size="18" class="minor">試料調製の時間軸に沿って「いつ加え、どの工程を評価するか」を区別する</text>
<line x1="45" y1="109" x2="1465" y2="109" class="border"/>
<text x="63" y="145" font-size="20" class="bold">対象：排ガスの JIS K 0311:2020 における主な添加段階（他媒体には自動適用しない）</text><rect class="panel" x="65" y="286" width="228" height="126" rx="12"/><text x="179" y="328" font-size="25" class="center bold">採取前</text><text x="179" y="365" font-size="19" class="center">捕集部の準備</text><path class="arr" d="M297 349 L341 349" marker-end="url(#arrow)"/><rect class="panel" x="351" y="286" width="228" height="126" rx="12"/><text x="465" y="328" font-size="25" class="center bold">排ガス採取</text><text x="465" y="365" font-size="19" class="center">捕集・試料回収</text><path class="arr" d="M583 349 L627 349" marker-end="url(#arrow)"/><rect class="gray" x="637" y="286" width="228" height="126" rx="12"/><text x="751" y="328" font-size="25" class="center bold">抽出前</text><text x="751" y="365" font-size="19" class="center">回収試料の調製</text><path class="arr" d="M869 349 L913 349" marker-end="url(#arrow)"/><rect class="panel" x="923" y="286" width="228" height="126" rx="12"/><text x="1037" y="328" font-size="25" class="center bold">抽出・精製</text><text x="1037" y="365" font-size="19" class="center">妨害除去と分画</text><path class="arr" d="M1155 349 L1199 349" marker-end="url(#arrow)"/><rect class="panel" x="1209" y="286" width="228" height="126" rx="12"/><text x="1323" y="328" font-size="25" class="center bold">最終液・GC/MS</text><text x="1323" y="365" font-size="19" class="center">添加・機器測定</text><rect class="dashbox" x="57" y="167" width="333" height="88" rx="12"/><text x="224" y="202" font-size="22" class="center bold">① サンプリングスパイク</text><text x="224" y="235" font-size="18" class="center">採取前、吸着捕集部に添加</text><path class="arr" d="M224 255 L224 282" marker-end="url(#arrow)"/><rect class="dashbox" x="537" y="445" width="390" height="89" rx="12"/><text x="732" y="481" font-size="22" class="center bold">② クリーンアップスパイク</text><text x="732" y="511" font-size="18" class="center">抽出より前に試料へ添加</text><path class="arr" d="M785 445 L785 417" marker-end="url(#arrow)"/><rect class="dashbox" x="1096" y="167" width="365" height="88" rx="12"/><text x="1279" y="202" font-size="22" class="center bold">③ シリンジスパイク</text><text x="1279" y="234" font-size="18" class="center">最終測定液への添加</text><path class="arr" d="M1279 255 L1279 282" marker-end="url(#arrow)"/><text x="65" y="578" font-size="23" class="bold">添加より前の失敗を後の内標準では検出・補正できない</text><rect class="gray" x="65" y="608" width="422" height="90" rx="12"/><text x="84" y="641" font-size="21" class="bold">① 主に捕集過程</text><text x="84" y="674" font-size="18" >捕集部での回収・破過等</text><rect class="gray" x="548" y="608" width="422" height="90" rx="12"/><text x="567" y="641" font-size="21" class="bold">② 抽出・精製工程</text><text x="567" y="674" font-size="18" >回収損失と同位体希釈定量</text><rect class="gray" x="1031" y="608" width="422" height="90" rx="12"/><text x="1050" y="641" font-size="21" class="bold">③ 最終液・機器</text><text x="1050" y="674" font-size="18" >機器導入・応答等の評価</text><text x="65" y="737" font-size="18" >注意：採取位置の不代表性を内標準が自動修正するわけではない。K 0312（水）は別の前処理・添加条件を確認。</text>
<line x1="45" y1="768" x2="1465" y2="768" class="border"/>
<text x="45" y="793" font-size="16" class="minor">根拠：第12章12.3.3、既存K0311部分監査（5.4.3・6.1・7.6）｜公式規格全文の最終照合はHOLD。</text>
</svg>