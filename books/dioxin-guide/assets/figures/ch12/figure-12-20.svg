<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1560 1020" width="1560" height="1020" role="img" aria-label="測定媒体・技術文書・法的評価の対応">
<title>測定媒体・技術文書・法的評価の対応</title><desc>JISの規格版、環境省マニュアル、法令・環境基準の役割を独立に整理する</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#202632"/></marker></defs>
<style>
text{font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#1d2630}
.bold{font-weight:700}.center{text-anchor:middle}.small{font-size:16px}.minor{fill:#495461}
.panel{fill:#fff;stroke:#202632;stroke-width:2.3}.gray{fill:#f0f2f4;stroke:#202632;stroke-width:2.3}
.tint{fill:#dfe3e8;stroke:#202632;stroke-width:2.3}
.dashbox{fill:#fff;stroke:#47515c;stroke-width:2.4;stroke-dasharray:9 6}
.arr{stroke:#202632;stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#66707a;stroke-width:2;fill:none}.dashed{stroke:#65707a;stroke-width:2.5;stroke-dasharray:8 6;fill:none}
.particle{fill:#1d2630;stroke:#1d2630}.border{stroke:#9aa2ab;stroke-width:1}
</style>
<rect width="1560" height="1020" fill="white"/>
<text x="45" y="54" font-size="31" class="bold">図12-20　測定媒体・技術文書・法的評価の対応</text>
<text x="45" y="89" font-size="18" class="minor">JISの規格版、環境省マニュアル、法令・環境基準の役割を独立に整理する</text>
<line x1="45" y1="109" x2="1515" y2="109" class="border"/>
<text x="58" y="143" font-size="21" class="bold">媒体・測定対象</text><text x="493" y="143" font-size="21" class="bold">関連する技術文書（対象・版）</text><text x="1099" y="143" font-size="21" class="bold">評価・適用先の確認</text><rect class="panel" x="58" y="171" width="325" height="111" rx="12"/><text x="220.5" y="213" font-size="25" class="center bold">排出ガス</text><rect class="panel" x="465" y="171" width="545" height="111" rx="12"/><text x="737.5" y="213" font-size="25" class="center bold">JIS K 0311:2020</text><text x="737.5" y="250" font-size="19" class="center">▲ 2020改正 ／ ○ 2024確認</text><text x="737.5" y="277" font-size="19" class="center">※ 2021-05-15 D.3正誤票</text><rect class="panel" x="1097" y="171" width="415" height="111" rx="12"/><text x="1304.5" y="213" font-size="25" class="center bold">ダイ特法施行規則2・3条</text><text x="1304.5" y="250" font-size="19" class="center">対象施設・排ガス基準・</text><text x="1304.5" y="277" font-size="19" class="center">O₂補正の条件を別確認</text><path class="arr" d="M391 225 L451 225" marker-end="url(#arrow)"/><path class="arr" d="M1018 225 L1083 225" marker-end="url(#arrow)"/><rect class="gray" x="58" y="302" width="325" height="111" rx="12"/><text x="220.5" y="344" font-size="25" class="center bold">工業用水・工場排水</text><rect class="gray" x="465" y="302" width="545" height="111" rx="12"/><text x="737.5" y="344" font-size="25" class="center bold">JIS K 0312:2020</text><text x="737.5" y="381" font-size="19" class="center">▲ 改正：2020-03-23</text><text x="737.5" y="408" font-size="19" class="center">旧2005版の正誤票は別管理</text><rect class="gray" x="1097" y="302" width="415" height="111" rx="12"/><text x="1304.5" y="344" font-size="25" class="center bold">法定の排出水かを判定</text><text x="1304.5" y="381" font-size="19" class="center">規則2・3条・排水基準</text><text x="1304.5" y="408" font-size="19" class="center">非対象水へ自動適用しない</text><path class="arr" d="M391 356 L451 356" marker-end="url(#arrow)"/><path class="arr" d="M1018 356 L1083 356" marker-end="url(#arrow)"/><rect class="panel" x="58" y="433" width="325" height="111" rx="12"/><text x="220.5" y="475" font-size="25" class="center bold">一般環境大気</text><rect class="panel" x="465" y="433" width="545" height="111" rx="12"/><text x="737.5" y="475" font-size="25" class="center bold">環境省 大気環境調査マニュアル</text><text x="737.5" y="512" font-size="19" class="center">▲ 2022-03改訂</text><text x="737.5" y="539" font-size="19" class="center">排ガス法と同一視しない</text><rect class="panel" x="1097" y="433" width="415" height="111" rx="12"/><text x="1304.5" y="475" font-size="25" class="center bold">環境基準・常時監視</text><text x="1304.5" y="512" font-size="19" class="center">測定目的・ND方式の</text><text x="1304.5" y="539" font-size="19" class="center">最新版を別確認</text><path class="arr" d="M391 487 L451 487" marker-end="url(#arrow)"/><path class="arr" d="M1018 487 L1083 487" marker-end="url(#arrow)"/><rect class="gray" x="58" y="564" width="325" height="111" rx="12"/><text x="220.5" y="606" font-size="25" class="center bold">土壌</text><rect class="gray" x="465" y="564" width="545" height="111" rx="12"/><text x="737.5" y="606" font-size="25" class="center bold">環境省 土壌調査測定マニュアル</text><text x="737.5" y="643" font-size="19" class="center">▲ 2022-03改訂</text><text x="737.5" y="670" font-size="19" class="center">採取場所・乾燥重量</text><rect class="gray" x="1097" y="564" width="415" height="111" rx="12"/><text x="1304.5" y="606" font-size="25" class="center bold">土壌環境基準等</text><text x="1304.5" y="643" font-size="19" class="center">法定基準・調査手法・</text><text x="1304.5" y="670" font-size="19" class="center">適用条件を確認</text><path class="arr" d="M391 618 L451 618" marker-end="url(#arrow)"/><path class="arr" d="M1018 618 L1083 618" marker-end="url(#arrow)"/><rect class="panel" x="58" y="695" width="325" height="111" rx="12"/><text x="220.5" y="737" font-size="25" class="center bold">底質</text><rect class="panel" x="465" y="695" width="545" height="111" rx="12"/><text x="737.5" y="737" font-size="25" class="center bold">環境省 底質調査測定マニュアル</text><text x="737.5" y="774" font-size="19" class="center">▲ 2022-03改訂</text><text x="737.5" y="801" font-size="19" class="center">底質／水質を区別</text><rect class="panel" x="1097" y="695" width="415" height="111" rx="12"/><text x="1304.5" y="737" font-size="25" class="center bold">底質環境基準等</text><text x="1304.5" y="774" font-size="19" class="center">常時監視・範囲確定で</text><text x="1304.5" y="801" font-size="19" class="center">算入法を区別</text><path class="arr" d="M391 749 L451 749" marker-end="url(#arrow)"/><path class="arr" d="M1018 749 L1083 749" marker-end="url(#arrow)"/><rect class="dashbox" x="58" y="845" width="1454" height="87" rx="12"/><text x="79" y="875" font-size="19" >◇＝公表　▲＝改正・改訂　○＝確認　※＝正誤票（確認は改正でない）。</text><text x="79" y="910" font-size="18" >K 0312:2005の2009-11正誤票は旧版に対応。2020版の訂正として移植しない。現行版・法的適用はHOLD。</text>
<line x1="45" y1="953" x2="1515" y2="953" class="border"/>
<text x="45" y="978" font-size="16" class="minor">根拠：第12章12.6.3／環境省公開マニュアル一覧／JSA正誤票一覧｜法令の現行適用・JIS全文はHOLD。</text>
</svg>